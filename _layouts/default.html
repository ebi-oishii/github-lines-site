<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
    <meta name="description" content="{{ page.description | default: site.description }}">
    <link rel="stylesheet" href="{{ '/assets/styles.css' | relative_url }}">
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="{{ '/' | relative_url }}">GitHub Lines</a>
      <nav class="nav" aria-label="主要ページ">
        <a href="{{ '/privacy/' | relative_url }}">プライバシー</a>
        <a href="https://github.com/ebi-oishii/github-lines">リポジトリ</a>
      </nav>
    </header>
    <main class="page">
      {{ content }}
    </main>
    <footer class="site-footer">
      <a href="https://github.com/ebi-oishii/github-lines/issues">不具合・要望</a>
    </footer>
  </body>
</html>
